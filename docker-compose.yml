services:
  modularcommerce.api:
    build:
      context: .
      dockerfile: src/Host/ModularCommerce.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ModularCommerceDb: "Server=mssql,1433;Database=ModularCommerceDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      - mssql

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
     ACCEPT_EULA: "Y"
     MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
     - "1433:1433"

